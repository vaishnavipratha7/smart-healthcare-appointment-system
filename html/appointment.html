<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hospital Appointment System</title>
    <link rel="stylesheet" href="/css/appointment.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">SmartHealthCare</div>
        <ul class="nav-links">
            <li><a href="/index.html">Home</a></li>
            <li><a href="/appointment.html" class="active">Book</a></li>
            <li><a href="/about.html">About</a></li>
            <li><a href="/login.html">Login</a></li>
            <li><a href="/signup.html">Sign Up</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2>Book a Hospital Appointment</h2>
        <form id="appointmentForm">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>
        
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>
        
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        
            <label for="hospital">Select Hospital:</label>
            <select id="hospital" name="hospital" required>
                <option value="" selected disabled>Select a Hospital</option>
                <option value="Apollo">Apollo Hospitals</option>
                <option value="Fortis">Fortis Healthcare</option>
                <option value="Yashodha">Yashodha Hospitals</option>
                <option value="NIMS">NIMS</option>
                <option value="Rainbow">Rainbow Hospitals</option>
            </select>
        
            <label for="doctor">Select Doctor:</label>
            <select id="doctor" name="doctor" required disabled>
                <option value="">Select Hospital First</option>
            </select>
        
            <label for="timeSlot">Select Time Slot:</label>
            <select id="timeSlot" name="timeSlot" required disabled>
                <option value="">Select Doctor First</option>
            </select>
        
            <label for="date">Select Date:</label>
            <input type="date" id="date" name="date" required>
        
            <label for="reason">Reason for Visit:</label>
            <textarea id="reason" name="reason" rows="3" required></textarea>
        
            <button type="submit">Book Appointment</button>
        </form>

        <a href="/api/logout" onclick="if(confirm('Are you sure?')) window.location.href=this.href; return false;">Logout</a>
        
        <div id="confirmation" style="display: none;"></div>
        <button id="bookAnotherBtn" style="display: none;">Book Another Appointment</button>
        <div id="appointmentList"></div> <!-- Added for cancel functionality -->
    </div>

    <script src="/js/appointment.js"></script>
</body>
</html>
